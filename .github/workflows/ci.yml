name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test (.NET 8 LTS + .NET 10)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (8.0 LTS and 10.0)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Prova.sln

      - name: Build
        run: dotnet build Prova.sln --no-restore --configuration Release

      # Runs every test project in the solution on every framework it targets.
      # The previous workflow invoked two named test projects on net10.0 only, so
      # Prova.Analyzers.Tests was never executed at all.
      - name: Test
        run: >
          dotnet test Prova.sln --no-build --configuration Release
          --coverage --coverage-output-format cobertura --results-directory ./coverage

      - name: Verify generator tests are discoverable
        shell: pwsh
        run: |
          $output = dotnet test tests/Prova.Generators.Tests/Prova.Generators.Tests.csproj --no-build --configuration Release --list-tests 2>&1
          $text = $output | Out-String
          # Guards the "zero tests ran" defect: both target frameworks must report a
          # discovery summary, both must be non-empty, and both must agree. The count is
          # deliberately not hardcoded -- a pinned number turns every legitimate new test
          # into a CI failure, which is the same drift that a hardcoded version string causes.
          $counts = [regex]::Matches($text, 'Discovered (\d+) tests in assembly') |
            ForEach-Object { [int]$_.Groups[1].Value }
          if ($counts.Count -ne 2) {
            $text
            throw "Expected a discovery summary for both net8.0 and net10.0; found $($counts.Count)."
          }
          if ($counts[0] -eq 0 -or $counts[1] -eq 0) {
            $text
            throw "Prova.Generators.Tests discovered zero tests: $($counts -join ', ')."
          }
          if ($counts[0] -ne $counts[1]) {
            $text
            throw "net8.0 and net10.0 discovered different test counts: $($counts -join ', ')."
          }
          Write-Host "Discovered $($counts[0]) generator tests on both target frameworks."

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-${{ matrix.os }}
          path: ./coverage

      - name: Pack
        run: dotnet pack Prova.sln --no-build --configuration Release --output ./artifacts

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Scoped to whitespace + style. The full `dotnet format` also runs analyzers, which
      # requires a successful workspace compilation; MSBuildWorkspace does not run Prova's
      # source generator, so the generated TestRunnerExecutor is invisible to it.
      - name: Verify formatting
        run: |
          dotnet format whitespace Prova.sln --verify-no-changes
          dotnet format style Prova.sln --verify-no-changes --severity warn

  preview:
    name: Preview .NET (net11.0)
    runs-on: ubuntu-latest
    # Advisory. A preview SDK can regress for reasons outside this repository, so this leg
    # reports breakage without blocking the merge queue.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (8.0, 10.0 and 11.0 preview)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Report SDK version
        run: dotnet --info

      - name: Restore (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet restore Prova.sln

      - name: Build (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet build Prova.sln --no-restore --configuration Release

      - name: Test (including net11.0)
        env:
          INCLUDE_PREVIEW_TFM: 'true'
        run: dotnet test Prova.sln --no-build --configuration Release
